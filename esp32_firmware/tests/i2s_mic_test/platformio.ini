; =============================================================================
;  INMP441 I2S mic bring-up test — a tiny standalone PlatformIO project.
;
;  Flash this FIRST to verify the mic wiring and gain before flashing the main
;  firmware. It shares src/config.h + src/mic_i2s.h with the main firmware, so
;  the pins / sample rate / shift / gain you verify here are exactly the same.
;
;  Open THIS folder (esp32_firmware/tests/i2s_mic_test) in PlatformIO and click
;  Upload, then open the Serial Plotter at 115200 baud and talk/tap the mic.
; =============================================================================

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
