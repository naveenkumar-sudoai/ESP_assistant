; =============================================================================
;  Whisper Assistant — ESP32 firmware
;  PlatformIO project configuration.
;  Board: generic ESP32 DevKitC / WROOM-32 (the standard 30/38-pin dev board).
;
;  Libraries are fetched automatically from the PlatformIO registry on the
;  first build — no manual library installation needed.
; =============================================================================

[env:esp32dev]
; Pinned to a known-good platform version. This resolves to Arduino-ESP32 core
; 2.0.17 on ESP-IDF 4.4.7, where the legacy I2S driver (driver/i2s.h) used for
; the INMP441 mic is fully supported with no deprecation warnings.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
